
name: Event Management System CI

on:
  push:
    branches:
      - main
      - feature/gokul
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: event_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d event_management"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_USER: postgres
      DB_HOST: localhost
      DB_NAME: event_management
      DB_PORT: 5432
      DB_PASSWORD: testpass
      PGPASSWORD: testpass
      JWT_SECRET: test_jwt_secret_for_ci_only
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create users table
        run: |
          psql -h localhost -U postgres -d event_management -c "
            CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              email VARCHAR(255) NOT NULL UNIQUE,
              password_hash TEXT NOT NULL,
              role VARCHAR(20) NOT NULL DEFAULT 'USER',
              status VARCHAR(20) NOT NULL DEFAULT 'ACTIVE',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
          "

      - name: Create events table
        run: |
          psql -h localhost -U postgres -d event_management -c "
          CREATE TABLE IF NOT EXISTS events (
              id SERIAL PRIMARY KEY,
              organizer_id INTEGER NOT NULL,
              title VARCHAR(200) NOT NULL,
              description TEXT,
              event_date DATE NOT NULL,
              event_time TIME NOT NULL,
              venue VARCHAR(255) NOT NULL,
              capacity INTEGER NOT NULL,
              registration_open BOOLEAN DEFAULT TRUE,
              status VARCHAR(30) DEFAULT 'ACTIVE',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          "

      - name: Create registrations table
        run: |
          psql -h localhost -U postgres -d event_management -c "
          CREATE TABLE IF NOT EXISTS registrations (
              id SERIAL PRIMARY KEY,
              event_id INTEGER NOT NULL,
              user_id INTEGER NOT NULL,
              status VARCHAR(30) DEFAULT 'REGISTERED',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              CONSTRAINT fk_registration_event
                  FOREIGN KEY (event_id)
                  REFERENCES events(id)
                  ON DELETE CASCADE,
              CONSTRAINT unique_event_user
                  UNIQUE (event_id, user_id)
          );
          "

      - name: Create tickets table
        run: |
          psql -h localhost -U postgres -d event_management -c "
          CREATE TABLE IF NOT EXISTS tickets (
              id SERIAL PRIMARY KEY,
              registration_id INTEGER NOT NULL UNIQUE
                  REFERENCES registrations(id) ON DELETE CASCADE,
              ticket_code VARCHAR(100) NOT NULL UNIQUE,
              status VARCHAR(20) NOT NULL DEFAULT 'VALID'
                  CHECK (status IN ('VALID', 'CANCELLED')),
              generated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          "

      - name: Create payments table
        run: |
          psql -h localhost -U postgres -d event_management -c "
          CREATE TABLE IF NOT EXISTS payments (
              id SERIAL PRIMARY KEY,
              registration_id INTEGER NOT NULL REFERENCES registrations(id) ON DELETE CASCADE,
              amount NUMERIC(10, 2) NOT NULL DEFAULT 0.00,
              payment_method VARCHAR(50) NOT NULL DEFAULT 'MOCK',
              transaction_id VARCHAR(100),
              status VARCHAR(20) NOT NULL DEFAULT 'SUCCESS',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          "

      - name: Create notifications table
        run: |
          psql -h localhost -U postgres -d event_management -c "
          CREATE TABLE IF NOT EXISTS notifications (
              id SERIAL PRIMARY KEY,
              user_id INTEGER NOT NULL,
              recipient_email VARCHAR(255) NOT NULL,
              event_id INTEGER,
              registration_id INTEGER,
              type VARCHAR(50) NOT NULL,
              title VARCHAR(255) NOT NULL,
              message TEXT NOT NULL,
              status VARCHAR(20) NOT NULL DEFAULT 'SENT',
              is_read BOOLEAN NOT NULL DEFAULT FALSE,
              read_at TIMESTAMP,
              sent_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          "

      - name: Create audit_logs table
        run: |
          psql -h localhost -U postgres -d event_management -c "
          CREATE TABLE IF NOT EXISTS audit_logs (
              id SERIAL PRIMARY KEY,
              admin_id INTEGER NOT NULL,
              action VARCHAR(100) NOT NULL,
              target_type VARCHAR(50),
              target_id INTEGER,
              details TEXT,
              status VARCHAR(20) NOT NULL DEFAULT 'SUCCESS',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          "

      - name: Run ESLint
        run: npm run lint

      - name: Run backend tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          if-no-files-found: ignore
